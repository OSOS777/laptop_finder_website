<!DOCTYPE html>
<html lang="en" class="battery">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - Student Laptop Finder</title>
    <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="bg-[var(--color-bg-battery)] text-[var(--color-text-battery)] transition-colors duration-300 min-h-screen flex flex-col">

    <header class="p-4 shadow-md bg-white/50 backdrop-blur-md sticky top-0 z-50">
        <div class="container mx-auto flex flex-wrap justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-[var(--color-accent-battery)]">💻 LaptopFinder</a>
            
            <nav class="hidden md:flex gap-6 font-medium">
                <a href="index.html" class="hover:text-[var(--color-accent-battery)] transition">Home</a>
                <a href="laptops.html" class="hover:text-[var(--color-accent-battery)] transition">Catalogue</a>
                <a href="favorites.html" class="text-[var(--color-accent-battery)] font-bold">Favorites</a>
                <a href="compare.html" class="hover:text-[var(--color-accent-battery)] transition">Compare</a>
            </nav>

            <div class="flex items-center gap-2">
                <button id="theme-toggle" class="btn-action bg-gray-200 text-gray-800 hover:bg-gray-300 text-sm">
                    🍃 Battery Saver
                </button>
                <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg bg-gray-200 text-gray-800 font-bold">
                    ☰
                </button>
            </div>
        </div>
        <nav id="mobile-menu" class="hidden md:hidden flex-col gap-3 pt-4 mt-3 border-t border-gray-300/40 font-medium container mx-auto">
            <a href="index.html" class="block py-1 hover:text-[var(--color-accent-battery)]">Home</a>
            <a href="laptops.html" class="block py-1 hover:text-[var(--color-accent-battery)]">Catalogue</a>
            <a href="favorites.html" class="block py-1 text-[var(--color-accent-battery)] font-bold">Favorites</a>
            <a href="compare.html" class="block py-1 hover:text-[var(--color-accent-battery)]">Compare</a>
        </nav>
    </header>

    <main class="container mx-auto p-6 flex-grow">
        <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
            <h1 class="text-3xl md:text-5xl font-bold">Your Favorites ❤️</h1>
            <button id="clear-favs-btn" class="btn-action bg-red-500 text-white hover:bg-red-600 hidden">
                🗑️ Clear All
            </button>
        </div>

        <div id="fav-summary" class="hidden grid-cols-1 sm:grid-cols-2 gap-4 mb-8 max-w-2xl">
            <div class="bg-white text-gray-900 p-5 rounded-2xl shadow border border-gray-200">
                <span class="text-xs font-bold uppercase text-gray-500">Total Price</span>
                <p id="fav-total-price" class="text-3xl font-black text-[var(--color-accent-battery)] mt-1">$0</p>
            </div>
            <div class="bg-white text-gray-900 p-5 rounded-2xl shadow border border-gray-200">
                <span class="text-xs font-bold uppercase text-gray-500">Average Price</span>
                <p id="fav-avg-price" class="text-3xl font-black text-[var(--color-accent-battery)] mt-1">$0</p>
            </div>
        </div>
        
        <div id="favorites-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        </div>
    </main>

    <footer class="p-4 text-center text-sm opacity-70 mt-auto">
        &copy; 2026 Student Laptop Finder. Built with Tailwind CSS & Vanilla JS.
    </footer>

    <script type="module" src="./src/js/favorites.js"></script>
</body>
</html>
